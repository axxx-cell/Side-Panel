name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unzip if uploaded as SidePanel.zip)
        id: p
        run: |
          if [ -f SidePanel.zip ]; then
            unzip -oq SidePanel.zip -d proj
            echo "dir=proj" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SidePanel-debug-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare signing key
        id: key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.key.outputs.signed == 'true'
        working-directory: ${{ steps.p.outputs.dir }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon

      - name: Upload signed release APK
        if: steps.key.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SidePanel-release-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/release/*.apk
