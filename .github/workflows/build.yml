name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Assemble project (SidePanel.zip + Group zips)
        id: p
        run: |
          set -e
          if [ -f SidePanel.zip ]; then
            rm -rf proj && mkdir proj
            unzip -oq SidePanel.zip -d proj
            SETTINGS=$(find proj -maxdepth 3 -name 'settings.gradle*' | head -1)
            [ -n "$SETTINGS" ] || { echo "No settings.gradle found in SidePanel.zip"; exit 1; }
            DIR=$(dirname "$SETTINGS")
          else
            DIR=.
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          if ls Group*.zip >/dev/null 2>&1; then
            G=$(mktemp -d)
            for z in Group*.zip; do unzip -oq "$z" -d "$G"; done

            GRADLE=$(ls "$DIR"/app/build.gradle.kts "$DIR"/app/build.gradle 2>/dev/null | head -1)
            [ -n "$GRADLE" ] || { echo "app/build.gradle not found"; exit 1; }
            PKG=$(grep -oP "namespace\s*=?\s*[\"']\K[^\"']+" "$GRADLE" | head -1 || true)
            if [ -z "$PKG" ]; then
              PKG=$(grep -oP 'package="\K[^"]+' "$DIR/app/src/main/AndroidManifest.xml" | head -1 || true)
            fi
            [ -n "$PKG" ] || { echo "Could not find the package name"; exit 1; }
            echo "Package: $PKG"

            SRC="$DIR/app/src/main"
            PKGDIR="$SRC/java/${PKG//.//}"

            # remove old code and old launcher icons
            find "$SRC" -name '*.kt' -delete
            find "$SRC" -name '*.java' -delete
            find "$SRC/res" -name 'ic_launcher*' -delete
            sed -i '/name="accessibility_description"/d' "$SRC"/res/values*/*.xml 2>/dev/null || true

            # new code (package name rewritten) and new resources
            mkdir -p "$PKGDIR"
            for f in "$G"/app/src/main/java/com/example/sidepanel/*.kt; do
              sed "s/com\.example\.sidepanel/$PKG/g" "$f" > "$PKGDIR/$(basename "$f")"
            done
            cp -r "$G"/app/src/main/res/. "$SRC/res/"

            # new manifest
            cat > "$SRC/AndroidManifest.xml" <<'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="Side Panel"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".PanelAccessibilityService"
                      android:exported="false"
                      android:label="Side Panel"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          MANIFEST

            # dependencies
            cat >> "$GRADLE" <<'DEPS'

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.viewpager2:viewpager2:1.1.0")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          DEPS
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7
     
      - name: Enable AndroidX
        run: printf '\nandroid.useAndroidX=true\n' >> "${{ steps.p.outputs.dir }}/gradle.properties"
    
      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          echo "===== ERRORS ====="
          grep -nE "^e: |What went wrong|AAPT|error:" -A3 build.log | head -80
          echo "===== LAST LINES ====="
          tail -30 build.log
          exit $code
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: SidePanel-debug-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
